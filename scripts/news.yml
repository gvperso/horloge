name: Mise à jour des news

on:
  schedule:
    - cron: "17 5 * * *"    # 07:17 Paris (été) / 06:17 (hiver)
    - cron: "17 12 * * *"   # 14:17 Paris (été) / 13:17 (hiver), avant l'ouverture US
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le calendrier
        run: python3 scripts/update_news.py
      - name: Enregistrer si changement
        run: |
          if [ -n "$(git status --porcelain events.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "News : mise à jour automatique"
            git push
          else
            echo "Rien à enregistrer."
          fi
